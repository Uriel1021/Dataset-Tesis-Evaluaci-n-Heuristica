# =====================================================================
# Rúbrica de inspección heurística (evaluación por guías, determinista)
# ---------------------------------------------------------------------
# Fundamento:
#   * Método: inspección automatizada por revisión de guías
#     ("guideline review", Ivory y Hearst, 2001): cada criterio se
#     comprueba en el marcado y se reporta con su evidencia.
#   * Contenido: cada criterio operacionaliza una pregunta guía de la
#     heurística de Nielsen (1994) y se ancla en un criterio de éxito de
#     WCAG 2.2 (W3C, 2023) o en una buena práctica documentada.
#   * Severidad: escala 0–4 de Nielsen (1994b), que combina IMPACTO y
#     FRECUENCIA. Impacto = nivel de conformidad WCAG (A → 3, AA → 2,
#     AAA/buena práctica → 1). Frecuencia = proporción de elementos
#     afectados entre los elegibles (ver `frequency`).
#   * Violación: severidad ≥ 2. Nielsen (1994b) define el 1 como
#     "problema cosmético: no necesita arreglarse salvo que sobre tiempo",
#     por lo que no se cuenta como violación.
#   * Evaluabilidad: si ningún criterio de una heurística tiene elementos
#     elegibles en la página, la heurística queda "no evaluable" (NA).
#
# Limitación declarada: la inspección es ESTÁTICA (HTML capturado). No
# observa CSS calculado ni manejadores de eventos añadidos por JavaScript;
# por eso algunos criterios (p. ej. controles no estándar) subestiman.
#
# Parámetros fijados ANTES de ver la distribución de etiquetas.
# =====================================================================

violation_min_severity: 2

impact_by_level: {A: 3, AA: 2, AAA: 1, BP: 1}

frequency:          # solo criterios de proporción
  high: 0.25        # ratio ≥ high  → severidad = impacto
  low: 0.05         # low ≤ ratio < high → impacto − 1 ; ratio < low → impacto − 2 (mínimo 0)

thresholds:
  min_nav_links: 3          # navegación que debería indicar la ubicación actual
  min_text_chars_headings: 500
  min_links_for_search: 100

checks:
  # ------------------------------------------------------------ H1
  H1_page_title:
    heuristic: H1
    question: "¿Es visible el estado actual del sistema (en qué página estoy)?"
    criterion: "WCAG 2.4.2 Page Titled"
    level: A
    kind: binary
    rule: "Falla si el documento no tiene <title> o está vacío."
  H1_status_messages:
    heuristic: H1
    question: "¿El sistema da retroalimentación sobre las acciones del usuario?"
    criterion: "WCAG 4.1.3 Status Messages"
    level: AA
    kind: binary
    rule: "Elegible si la página tiene campos de entrada. Falla si no existe ninguna región de estado (aria-live, role=status|alert|log|progressbar, <output>, <progress>)."
  H1_expanded_state:
    heuristic: H1
    question: "¿Se indica el estado de los controles (abierto/cerrado)?"
    criterion: "WCAG 4.1.2 Name, Role, Value (estado)"
    level: A
    kind: ratio
    rule: "Elegibles: controles con aria-haspopup o aria-controls. Fallan los que no exponen aria-expanded."
  H1_current_location:
    heuristic: H1
    question: "¿Se indica la página o sección activa?"
    criterion: "WCAG 2.4.8 Location"
    level: AAA
    kind: binary
    rule: "Elegible si hay <nav>/role=navigation con ≥ min_nav_links enlaces. Falla si ningún elemento de la navegación tiene aria-current ni clase active|current|selected."

  # ------------------------------------------------------------ H4
  H4_ambiguous_link_names:
    heuristic: H4
    question: "¿Los mismos nombres significan lo mismo?"
    criterion: "WCAG 2.4.4 Link Purpose / 3.2.4 Consistent Identification"
    level: AA
    kind: ratio
    rule: "Elegibles: nombres de enlace distintos (≥ 2 caracteres). Fallan los nombres que llevan a más de un destino distinto."
  H4_nonstandard_controls:
    heuristic: H4
    question: "¿Se siguen las convenciones de la plataforma para los controles?"
    criterion: "WCAG 4.1.2 Name, Role, Value (rol)"
    level: A
    kind: ratio
    rule: "Elegibles: elementos no nativos con onclick o tabindex ≥ 0. Fallan los que no declaran un rol interactivo."
  H4_links_as_buttons:
    heuristic: H4
    question: "¿Los enlaces navegan y los botones ejecutan acciones, como es convención?"
    criterion: "Buena práctica HTML (enlace sin destino); WCAG 2.1.1 si no es enfocable"
    level: AA
    kind: ratio
    rule: "Elegibles: todos los <a>. Fallan los que no tienen href o usan href='#'/'javascript:' sin role=button."
  H4_heading_skips:
    heuristic: H4
    question: "¿La estructura de encabezados es consistente?"
    criterion: "WCAG 1.3.1 Info and Relationships (buena práctica de jerarquía)"
    level: BP
    kind: ratio
    rule: "Elegibles: transiciones entre encabezados consecutivos (≥ 2 encabezados). Fallan los saltos descendentes de más de un nivel."

  # ------------------------------------------------------------ H5
  H5_input_type_mismatch:
    heuristic: H5
    question: "¿El diseño elimina condiciones propensas a errores?"
    criterion: "WCAG 3.3.4 Error Prevention / 1.3.5 (buena práctica de tipos de entrada)"
    level: AA
    kind: ratio
    rule: "Elegibles: campos cuyo nombre/id/placeholder/etiqueta indica correo, teléfono, URL, número o fecha. Fallan los de type=text o sin type."
  H5_autocomplete_missing:
    heuristic: H5
    question: "¿Se reducen los errores de escritura de datos conocidos?"
    criterion: "WCAG 1.3.5 Identify Input Purpose"
    level: AA
    kind: ratio
    rule: "Elegibles: campos de datos personales (nombre, correo, teléfono, dirección, código postal, ciudad, país, usuario, contraseña, tarjeta). Fallan los que no tienen autocomplete."
  H5_constraints_not_communicated:
    heuristic: H5
    question: "¿Se comunican las restricciones de entrada?"
    criterion: "WCAG 3.3.2 Labels or Instructions"
    level: A
    kind: ratio
    rule: "Elegibles: campos con pattern, minlength, min o max. Fallan los que no tienen aria-describedby ni title."

  # ------------------------------------------------------------ H6
  H6_unlabeled_inputs:
    heuristic: H6
    question: "¿Las instrucciones y etiquetas están visibles en vez de exigir recordar?"
    criterion: "WCAG 3.3.2 Labels or Instructions / 1.3.1 / 4.1.2"
    level: A
    kind: ratio
    rule: "Elegibles: campos de entrada. Fallan los que no tienen etiqueta (label for, label envolvente, aria-label, aria-labelledby o title); un placeholder no cuenta."
  H6_unnamed_controls:
    heuristic: H6
    question: "¿Las acciones son reconocibles sin tener que recordar qué hace un ícono?"
    criterion: "WCAG 4.1.2 Name, Role, Value / 2.4.4 Link Purpose"
    level: A
    kind: ratio
    rule: "Elegibles: enlaces con href y botones. Fallan los que no tienen nombre accesible (texto, aria-label, aria-labelledby, title o alt de una imagen interna)."
  H6_images_without_alt:
    heuristic: H6
    question: "¿La información está disponible para reconocerla?"
    criterion: "WCAG 1.1.1 Non-text Content"
    level: A
    kind: ratio
    rule: "Elegibles: <img> no ocultas (aria-hidden, role=presentation|none). Fallan las que no tienen atributo alt (alt='' es válido para decorativas)."
  H6_no_headings:
    heuristic: H6
    question: "¿La estructura visible ayuda a reconocer dónde está cada cosa?"
    criterion: "WCAG 2.4.6 Headings and Labels / 1.3.1"
    level: AA
    kind: binary
    rule: "Elegible si el texto visible supera min_text_chars_headings caracteres. Falla si no hay ningún encabezado (h1–h6 ni role=heading)."
  H6_no_search_large_page:
    heuristic: H6
    question: "¿Se puede encontrar información sin recordar su ubicación?"
    criterion: "Buena práctica (búsqueda en páginas extensas; WCAG 2.4.5 Multiple Ways, a nivel de sitio)"
    level: BP
    kind: binary
    rule: "Elegible si la página tiene ≥ min_links_for_search enlaces. Falla si no hay campo de búsqueda (type=search, role=search o name/id/aria-label que contenga 'search'/'buscar'/'q')."
